<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>// CHUNK LOADER — MC TECH DEV</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080c;
    --panel:#0e0f16;
    --line:#1c2030;
    --txt:#d6e2f0;
    --dim:#5a6478;
    --green:#5ee36f;
    --cyan:#4dd8ff;
    --purple:#b98bff;
    --red:#ff5d6c;
    --gold:#ffcf4d;
    --xp:#7fff5e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:'Share Tech Mono',monospace;
    overflow-x:hidden;
    cursor:none;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--green);color:#000}

  /* ===== КАСТОМНЫЙ КУРСОР-КИРКА ===== */
  #pickaxe{
    position:fixed;z-index:99999;pointer-events:none;
    width:38px;height:38px;transform:translate(-6px,-6px) rotate(-20deg);
    transition:transform .12s ease-out;
    filter:drop-shadow(0 0 8px rgba(94,227,111,.6));
  }
  #pickaxe.swing{transform:translate(-6px,-6px) rotate(28deg) scale(1.15)}
  #pickaxe svg{width:100%;height:100%}
  #cursorRing{
    position:fixed;z-index:99998;pointer-events:none;
    width:6px;height:6px;border-radius:50%;
    background:var(--green);box-shadow:0 0 12px 3px rgba(94,227,111,.7);
    transform:translate(-50%,-50%);
  }

  /* ===== BOOT SCREEN ===== */
  #boot{
    position:fixed;inset:0;z-index:100000;
    background:#000;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 8vw;font-size:clamp(11px,1.5vw,15px);
    transition:opacity .8s ease, visibility .8s;
  }
  #boot.done{opacity:0;visibility:hidden}
  .boot-line{color:var(--green);white-space:pre-wrap;line-height:1.7;min-height:1.7em}
  .boot-line .ok{color:var(--cyan)}
  .boot-line .warn{color:var(--gold)}
  .boot-cursor{display:inline-block;width:9px;height:1em;background:var(--green);vertical-align:middle;animation:blink .9s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .boot-bar{
    margin-top:28px;width:min(520px,80vw);height:14px;
    border:2px solid var(--green);position:relative;overflow:hidden;
  }
  .boot-bar-fill{
    height:100%;width:0%;
    background:repeating-linear-gradient(90deg,var(--green) 0 8px,transparent 8px 10px);
    transition:width .18s linear;
  }
  .boot-pct{color:var(--gold);margin-top:10px;font-size:12px;letter-spacing:1px}

  /* ===== МИР ===== */
  #world{position:relative;z-index:2;opacity:0;transition:opacity 1s ease .2s}
  #world.on{opacity:1}

  /* фон: небо + чанки */
  .sky{
    position:fixed;inset:0;z-index:0;
    background:
      radial-gradient(circle at 78% 18%, rgba(120,180,255,.14), transparent 42%),
      radial-gradient(circle at 12% 82%, rgba(185,139,255,.12), transparent 45%),
      linear-gradient(180deg,#070810 0%,#0a0c16 55%,#0d0a14 100%);
  }
  .voxel-ground{
    position:fixed;bottom:0;left:0;width:100%;height:220px;z-index:1;
    pointer-events:none;
    background-image:
      linear-gradient(90deg,rgba(94,227,111,.09) 1px,transparent 1px),
      linear-gradient(0deg,rgba(94,227,111,.09) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:linear-gradient(0deg,#000 5%,transparent 95%);
    -webkit-mask-image:linear-gradient(0deg,#000 5%,transparent 95%);
  }
  .scanlines{
    position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    box-shadow:inset 0 0 240px 60px rgba(0,0,0,.9);
  }

  main{position:relative;z-index:4;max-width:1080px;margin:0 auto;padding:0 20px 120px}

  /* ===== HUD ВЕРХНИЙ ===== */
  .hud{
    position:fixed;top:0;left:0;right:0;z-index:50;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;
    background:linear-gradient(180deg,rgba(8,8,12,.94),rgba(8,8,12,0));
    font-size:12px;letter-spacing:1px;
    backdrop-filter:blur(4px);
  }
  .hud-logo{
    font-family:'VT323',monospace;font-size:22px;color:var(--green);
    cursor:pointer;user-select:none;
    text-shadow:0 0 12px rgba(94,227,111,.6);
    transition:.2s;
  }
  .hud-logo:hover{color:var(--cyan);text-shadow:0 0 18px rgba(77,216,255,.9)}
  .hud-right{display:flex;gap:22px;align-items:center;color:var(--dim)}
  .hud-fps{color:var(--gold)}
  .hud-ping{color:var(--cyan)}
  .hud-status{color:var(--green)}
  .hud-status::before{content:"● ";animation:blink 1.6s steps(1) infinite}

  /* ===== ХОТБАР СНИЗУ (навигация) ===== */
  .hotbar{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    z-index:60;display:flex;gap:6px;padding:6px;
    background:rgba(14,15,22,.9);border:2px solid var(--line);
    border-radius:6px;backdrop-filter:blur(8px);
    box-shadow:0 8px 40px rgba(0,0,0,.8);
  }
  .slot{
    width:52px;height:52px;border:2px solid transparent;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;cursor:none;position:relative;
    background:rgba(255,255,255,.03);transition:.18s;
    border-radius:3px;
  }
  .slot:hover{background:rgba(94,227,111,.12);border-color:rgba(94,227,111,.5);transform:translateY(-4px)}
  .slot .lbl{
    position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:1px;color:var(--green);white-space:nowrap;
    background:#000;border:1px solid var(--green);padding:4px 8px;border-radius:3px;
    opacity:0;pointer-events:none;transition:.18s;
  }
  .slot:hover .lbl{opacity:1;bottom:calc(100% + 8px)}
  .slot .key{position:absolute;bottom:2px;right:4px;font-size:9px;color:var(--dim)}

  /* ===== СЕКЦИИ-«ЧАНКИ» ===== */
  .chunk{
    border:2px solid var(--line);border-radius:4px;
    background:linear-gradient(150deg,rgba(14,15,22,.92),rgba(10,11,17,.92));
    padding:38px 34px;margin:80px 0;position:relative;
    transition:.4s cubic-bezier(.2,.8,.2,1);
  }
  .chunk::before{
    content:attr(data-chunk);
    position:absolute;top:-11px;left:22px;background:var(--bg);padding:0 10px;
    font-size:11px;letter-spacing:2px;color:var(--cyan);
  }
  .chunk::after{
    content:"";position:absolute;top:0;left:0;width:100%;height:2px;
    background:linear-gradient(90deg,var(--green),var(--cyan),var(--purple),transparent);
    transform:scaleX(0);transform-origin:left;transition:.7s ease;
  }
  .chunk.in::after{transform:scaleX(1)}
  .chunk:hover{border-color:rgba(94,227,111,.35);box-shadow:0 0 0 1px rgba(94,227,111,.08),0 30px 70px -30px rgba(0,0,0,.9)}

  .reveal{opacity:0;transform:translateY(30px);transition:.8s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:none}

  h1{
    font-family:'VT323',monospace;
    font-size:clamp(2.6rem,8vw,5.4rem);
    line-height:.95;letter-spacing:1px;font-weight:400;
    margin-bottom:20px;
  }
  h1 .glitch{
    position:relative;display:inline-block;color:var(--green);
    text-shadow:0 0 22px rgba(94,227,111,.5);
  }
  h1 .glitch::before,h1 .glitch::after{
    content:attr(data-t);position:absolute;left:0;top:0;width:100%;
    overflow:hidden;
  }
  h1 .glitch::before{color:var(--cyan);animation:gl1 3.4s infinite linear alternate}
  h1 .glitch::after{color:var(--red);animation:gl2 2.6s infinite linear alternate}
  @keyframes gl1{
    0%,92%,100%{clip-path:inset(100% 0 0 0);transform:translateX(0)}
    93%{clip-path:inset(10% 0 70% 0);transform:translateX(-4px)}
    95%{clip-path:inset(50% 0 20% 0);transform:translateX(5px)}
    97%{clip-path:inset(80% 0 5% 0);transform:translateX(-3px)}
  }
  @keyframes gl2{
    0%,88%,100%{clip-path:inset(100% 0 0 0);transform:translateX(0)}
    90%{clip-path:inset(30% 0 55% 0);transform:translateX(4px)}
    94%{clip-path:inset(65% 0 12% 0);transform:translateX(-5px)}
    98%{clip-path:inset(5% 0 85% 0);transform:translateX(3px)}
  }

  h2{
    font-family:'VT323',monospace;font-size:clamp(1.8rem,4.5vw,3rem);
    letter-spacing:1px;margin-bottom:8px;font-weight:400;color:var(--txt);
  }
  h2 .hl{color:var(--cyan)}
  .sec-note{color:var(--dim);font-size:13px;letter-spacing:1px;margin-bottom:36px}
  .sec-note::before{content:"> ";color:var(--green)}

  /* ===== HERO ===== */
  .hero-grid{
    display:grid;grid-template-columns:1.15fr .85fr;gap:52px;align-items:center;
    padding:120px 0 40px;min-height:88vh;
  }
  .type-line{color:var(--green);font-size:clamp(.95rem,2vw,1.2rem);margin-bottom:14px;letter-spacing:1px;min-height:1.5em}
  .type-line .cur{display:inline-block;width:10px;height:1.1em;background:var(--green);vertical-align:middle;animation:blink .8s steps(1) infinite}
  .hero-sub{color:var(--dim);max-width:560px;font-size:14.5px;line-height:1.9;margin:26px 0 34px}
  .hero-sub b{color:var(--txt);background:rgba(94,227,111,.1);padding:1px 5px;border-radius:2px}
  .hero-sub .xp{color:var(--xp)}

  /* ===== ПЕРСОНАЖ-МОДЕЛЬ (вместо фото) ===== */
  .skin-stage{
    position:relative;display:flex;align-items:center;justify-content:center;
    min-height:400px;perspective:1200px;
  }
  .skin-base{
    position:relative;width:180px;height:300px;
    transform-style:preserve-3d;
    animation:idleBob 3.6s ease-in-out infinite;
  }
  @keyframes idleBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .part{
    position:absolute;background-size:cover;background-repeat:no-repeat;
    image-rendering:pixelated;
    border:1px solid rgba(0,0,0,.4);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  }
  /* Если картинки скина нет — placeholder-«кубики» */
  .ph{background-image:none !important;background:linear-gradient(150deg,var(--green),var(--cyan))}
  .skin-head{width:70px;height:70px;left:55px;top:0;border-radius:3px}
  .skin-body{width:70px;height:96px;left:55px;top:74px;border-radius:3px}
  .skin-arm-l{width:28px;height:88px;left:23px;top:76px;border-radius:3px;transform-origin:top center;animation:swayL 3.6s ease-in-out infinite}
  .skin-arm-r{width:28px;height:88px;left:129px;top:76px;border-radius:3px;transform-origin:top center;animation:swayR 3.6s ease-in-out infinite}
  .skin-leg-l{width:32px;height:88px;left:50px;top:172px;border-radius:3px;transform-origin:top center}
  .skin-leg-r{width:32px;height:88px;left:98px;top:172px;border-radius:3px;transform-origin:top center}
  @keyframes swayL{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-4deg)}}
  @keyframes swayR{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}

  .skin-shadow{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:130px;height:20px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(94,227,111,.22),transparent 70%);
    filter:blur(4px);
  }
  /* табличка имени */
  .nameplate{
    position:absolute;top:-46px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.75);border:1px solid var(--green);
    padding:5px 16px;font-size:12px;letter-spacing:1.5px;color:var(--green);
    white-space:nowrap;border-radius:3px;
    box-shadow:0 0 18px rgba(94,227,111,.35);
  }
  /* шкала здоровья/брони над моделью */
  .health-bar{
    position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    display:flex;gap:3px;font-size:11px;
  }
  .hp{color:var(--red);filter:drop-shadow(0 0 4px rgba(255,93,108,.7))}

  /* ===== РЕДСТОУН-КАРТА НАВЫКОВ ===== */
  .redstone-map{
    position:relative;padding:20px 0;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:0;
  }
  /* соединительные линии */
  .rs-node{
    position:relative;padding:26px 22px;
    border:1px solid var(--line);background:rgba(10,11,17,.7);
    transition:.35s;cursor:none;
  }
  .rs-node:hover{
    background:rgba(94,227,111,.06);
    border-color:var(--green);
    box-shadow:0 0 30px -8px rgba(94,227,111,.5);
  }
  .rs-node::before{
    content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;
    border-left:2px solid var(--red);border-top:2px solid var(--red);
  }
  .rs-node::after{
    content:"";position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;
    border-right:2px solid var(--red);border-bottom:2px solid var(--red);
  }
  .rs-node:hover::before,.rs-node:hover::after{border-color:var(--green)}
  .rs-ico{font-size:26px;margin-bottom:12px;display:block}
  .rs-node h3{
    font-family:'VT323',monospace;font-size:1.5rem;font-weight:400;
    letter-spacing:.5px;margin-bottom:10px;color:var(--txt);
  }
  .rs-node:hover h3{color:var(--green)}
  .rs-node p{color:var(--dim);font-size:13px;line-height:1.75}
  .rs-node .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chip{
    font-size:10px;letter-spacing:.5px;padding:3px 8px;border-radius:2px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);
  }
  /* редстоун-«провода» между узлами на десктопе */
  .rs-wire{
    position:absolute;top:50%;left:100%;width:100%;height:2px;
    background:repeating-linear-gradient(90deg,var(--red) 0 6px,transparent 6px 12px);
    z-index:-1;opacity:.5;
  }
  /* энергия бежит */
  @keyframes flow{to{background-position:24px 0}}
  .rs-node:hover ~ .rs-wire{animation:flow .6s linear infinite}

  /* ===== КОНСОЛЬ ===== */
  .console{
    background:#050609;border:2px solid var(--line);border-radius:4px;
    font-size:13.5px;overflow:hidden;
  }
  .console-head{
    display:flex;align-items:center;gap:8px;padding:10px 16px;
    background:#0b0d13;border-bottom:1px solid var(--line);
    font-size:11px;letter-spacing:1px;color:var(--dim);
  }
  .console-head .d{width:11px;height:11px;border-radius:50%}
  .d1{background:var(--red)}.d2{background:var(--gold)}.d3{background:var(--green)}
  .console-body{padding:20px;min-height:230px;max-height:340px;overflow-y:auto;line-height:1.85}
  .console-body::-webkit-scrollbar{width:8px}
  .console-body::-webkit-scrollbar-track{background:#0b0d13}
  .console-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .cl{white-space:pre-wrap;word-break:break-word}
  .cl .g{color:var(--green)}
  .cl .c{color:var(--cyan)}
  .cl .p{color:var(--purple)}
  .cl .r{color:var(--red)}
  .cl .y{color:var(--gold)}
  .cl .d{color:var(--dim)}
  .console-input{
    display:flex;align-items:center;gap:10px;padding:14px 20px;
    border-top:1px solid var(--line);background:#0b0d13;
  }
  .console-input .p{color:var(--green);font-size:14px}
  .console-input input{
    flex:1;background:transparent;border:none;outline:none;
    color:var(--green);font-family:'Share Tech Mono',monospace;font-size:14px;
    caret-color:var(--green);
  }
  .hint-keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .hint-key{
    font-size:11px;padding:5px 11px;border:1px solid var(--line);border-radius:2px;
    color:var(--dim);cursor:none;transition:.2s;background:rgba(255,255,255,.02);
  }
  .hint-key:hover{border-color:var(--green);color:var(--green);transform:translateY(-2px)}

  /* ===== ФОРМАТЫ ===== */
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .mode{
    border:2px solid var(--line);border-radius:4px;padding:32px 28px;
    position:relative;overflow:hidden;transition:.4s;background:rgba(10,11,17,.6);
  }
  .mode:hover{transform:translateY(-6px);border-color:var(--green)}
  .mode.long:hover{border-color:var(--purple)}
  .mode .m-tag{
    font-size:11px;letter-spacing:2px;color:var(--green);margin-bottom:14px;display:block;
  }
  .mode.long .m-tag{color:var(--purple)}
  .mode h3{font-family:'VT323',monospace;font-size:1.9rem;font-weight:400;margin-bottom:14px}
  .mode p{color:var(--dim);font-size:13.5px;line-height:1.85}
  .mode .bar{
    position:absolute;bottom:0;left:0;height:3px;width:100%;
    background:linear-gradient(90deg,var(--green),transparent);
    transform:scaleX(0);transform-origin:left;transition:.6s;
  }
  .mode.long .bar{background:linear-gradient(90deg,var(--purple),transparent)}
  .mode:hover .bar{transform:scaleX(1)}

  /* ===== ФИНАЛЬНЫЙ CTA ===== */
  .final{
    text-align:center;padding:60px 30px;
    border:2px dashed rgba(94,227,111,.35);border-radius:6px;
    background:radial-gradient(circle at 50% 0%,rgba(94,227,111,.07),transparent 60%);
    position:relative;
  }
  .final h2{margin-bottom:16px}
  .final p{color:var(--dim);max-width:520px;margin:0 auto 32px;font-size:14px}
  .btn-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .mc-btn{
    font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:1px;
    padding:14px 30px;border:2px solid var(--green);background:rgba(94,227,111,.06);
    color:var(--green);cursor:none;position:relative;border-radius:2px;
    transition:.2s;text-decoration:none;display:inline-flex;align-items:center;gap:10px;
  }
  .mc-btn::before{
    content:"";position:absolute;inset:0;background:var(--green);
    transform:scaleY(0);transform-origin:bottom;transition:.25s;z-index:-1;
  }
  .mc-btn:hover{color:#04140a;box-shadow:0 0 30px -6px rgba(94,227,111,.7)}
  .mc-btn:hover::before{transform:scaleY(1)}
  .mc-btn.alt{border-color:var(--cyan);color:var(--cyan);background:rgba(77,216,255,.06)}
  .mc-btn.alt::before{background:var(--cyan)}
  .mc-btn.alt:hover{color:#02141c;box-shadow:0 0 30px -6px rgba(77,216,255,.7)}

  /* ===== XP-ПОЛОСА ВНИЗУ ===== */
  .xp-bar{
    position:fixed;bottom:0;left:0;width:100%;height:26px;z-index:55;
    background:rgba(0,0,0,.85);border-top:1px solid var(--line);
    display:flex;align-items:center;padding:0 16px;gap:14px;
    font-size:10px;letter-spacing:1px;color:var(--dim);
    pointer-events:none;
  }
  .xp-track{
    flex:1;height:8px;background:#111;border:1px solid #222;position:relative;overflow:hidden;
  }
  .xp-fill{
    height:100%;width:0;background:linear-gradient(90deg,var(--xp),#3fa82f);
    transition:width .15s linear;box-shadow:0 0 12px rgba(127,255,94,.6);
  }
  .xp-lvl{color:var(--xp);font-weight:bold;font-size:12px}

  /* ===== МОДАЛКА ДОСТИЖЕНИЯ ===== */
  .achievement{
    position:fixed;top:70px;right:-420px;z-index:9999;
    width:min(360px,86vw);padding:16px 20px;
    background:linear-gradient(135deg,#1a1c24,#101218);
    border:2px solid var(--gold);border-radius:4px;
    display:flex;align-items:center;gap:16px;
    box-shadow:0 0 40px -8px rgba(255,207,77,.5);
    transition:right .55s cubic-bezier(.2,.9,.3,1.2);
  }
  .achievement.show{right:20px}
  .achievement .ico{
    width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,207,77,.12);border:2px solid var(--gold);border-radius:3px;font-size:22px;
  }
  .achievement .ttl{font-size:11px;letter-spacing:2px;color:var(--gold);margin-bottom:4px}
  .achievement .txt{font-size:13px;color:var(--txt);line-height:1.4}

  /* ===== КОМАНДНАЯ ПАЛИТРА (Ctrl+K) ===== */
  .palette{
    position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,.75);
    display:none;align-items:flex-start;justify-content:center;padding-top:14vh;
    backdrop-filter:blur(6px);
  }
  .palette.on{display:flex}
  .palette-box{
